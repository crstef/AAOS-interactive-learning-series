# Project-wide Gradle settings.

# JVM memory for the Gradle daemon. 2 GB is plenty for this small app and
# keeps room free for the Android Automotive emulator on a 20 GB machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build features
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Run Gradle tasks in parallel and cache results for faster rebuilds.
org.gradle.parallel=true
org.gradle.caching=true
